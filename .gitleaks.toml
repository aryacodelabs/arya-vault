# gitleaks configuration (used by the `secret-scan` job in .github/workflows/ci.yml).
# Start from the default ruleset; only the allowlist below is project-specific.
[extend]
useDefault = true

# The golden test vault (core/testdata/golden/, see its README) is FAKE data generated
# from a fixed public seed with the non-secure deterministic RNG; its "recovery key" is
# published in the README and in tests. Allow exactly that value in exactly that file so
# every other occurrence of anything key-shaped is still scanned.
[[allowlists]]
description = "Fake golden-vault recovery key in expected.json (canary test data)"
condition = "AND"
paths = ['''^core/testdata/golden/v1/expected\.json$''']
regexes = ['''MH365-7P3RV-640RY-YD7T8-RN1R5-65JCX-SA-65''']

# The Flutter test suite's fake master password (app/test/helpers.dart). Obvious canary,
# never used outside tests; allow exactly that value in exactly that file.
[[allowlists]]
description = "Fake master password canary in the Flutter test helpers"
condition = "AND"
paths = ['''^app/test/helpers\.dart$''']
regexes = ['''CANARY-correct-horse-battery-staple-9142''']

# A fake wrong password typed by a B03 widget test (the line was later reworded, but
# gitleaks also scans the commit that first contained it). Obvious canary, tests only.
[[allowlists]]
description = "Fake wrong-password canary in the B03 security settings test (earlier commit)"
condition = "AND"
paths = ['''^app/test/settings/security_settings_test\.dart$''']
regexes = ['''CANARY-wrong-pw-123''']

# The shared docs/14 contract suite (app/test/api/contract_suite.dart) types fake passwords
# into FakeVaultApi and the real core. The master password has to pass the core's strength
# policy, so it cannot carry an obvious CANARY marker; it exists only in this test file.
[[allowlists]]
description = "Fake passwords in the shared contract suite (test data only)"
condition = "AND"
paths = ['''^app/test/api/contract_suite\.dart$''']
regexes = [
  '''Tangerine-Quasar-vinyl-48-Hollow-Mitten''',
  '''CANARY-item-secret-[12]''',
]

# The Windows integration test uses a fake master password for a temporary vault.
[[allowlists]]
description = "Fake master password in the Windows integration test (test data only)"
condition = "AND"
paths = ['''^app/integration_test/app_test\.dart$''']
regexes = ['''CANARY-integration-Tangerine-Quasar-48-Hollow''']
