name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: cargo test --workspace --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: core/Cargo.toml
          command: check
          arguments: --all-features

  coverage:
    # Informational for now: report only, no threshold gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage (lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Summary
        run: |
          {
            echo '### Coverage (informational, no threshold)'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: core/lcov.info
          if-no-files-found: error

  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned release binary instead of gitleaks-action (which needs a license key
      # for organisation repos); no secrets are required.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan commits introduced by this PR
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --verbose \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  fuzz-smoke:
    # Proves the cargo-fuzz toolchain builds and runs; real targets plug in later (core/fuzz/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core/fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run smoke -- -max_total_time=10

  crosscheck:
    # Independent Python decryptor (tools/crosscheck) must open every golden vault and
    # reject tampered copies (docs/11 §2, SEC-C08). Linux only; hash-pinned dependencies.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned requirements (hashes required)
        run: |
          python3 -m venv "$RUNNER_TEMP/crosscheck-venv"
          "$RUNNER_TEMP/crosscheck-venv/bin/pip" install --require-hashes --no-deps -r tools/crosscheck/requirements.txt
      - name: Decrypt every golden vault independently
        run: '"$RUNNER_TEMP/crosscheck-venv/bin/python" -I tools/crosscheck/crosscheck.py core/testdata/golden'
      - name: Tampered copies must be rejected
        run: '"$RUNNER_TEMP/crosscheck-venv/bin/python" -I tools/crosscheck/test_negative.py core/testdata/golden'
      - name: Quick-unlock KEK vector (docs/04 section 8)
        run: '"$RUNNER_TEMP/crosscheck-venv/bin/python" -I tools/crosscheck/test_kek_qu.py'

  flutter:
    # B01: the Flutter app over the fake API (docs/cloud-tasks/m2/B01). Linux only; goldens are
    # generated on Linux (app/test/golden/README.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Keep in sync with app/.flutter-version and the `flutter:` constraint in app/pubspec.yaml.
      FLUTTER_VERSION: 3.47.7
      # sha256 of flutter_linux_3.47.7-stable.tar.xz from the official releases manifest
      # (https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json)
      FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned release tarball with a checksum instead of a third-party setup action.
      - name: Install Flutter (pinned, checksum-verified)
        run: |
          test "$(cat .flutter-version)" = "${FLUTTER_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/flutter.tar.xz"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify the version and turn analytics off
        run: |
          flutter --version | head -1 | grep -F "Flutter ${FLUTTER_VERSION} "
          flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/src/l10n
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  bindings:
    # L01: the generated flutter_rust_bridge bindings are current, and the app's shared docs/14
    # contract suite passes against the real core (not just the fake). Linux only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      # Same pin and checksum as the `flutter` job.
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # cache-bin (default) keeps the cargo-installed codegen between runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      # flutter_rust_bridge_codegen shells out to `cargo expand`.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-expand@1.0.127
      - name: Install Flutter (pinned, checksum-verified)
        run: |
          test "$(cat app/.flutter-version)" = "${FLUTTER_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/flutter.tar.xz"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify the version and turn analytics off
        run: |
          flutter --version | head -1 | grep -F "Flutter ${FLUTTER_VERSION} "
          flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: The Rust API version and the app's expected version agree
        run: bash tools/codegen/check-api-version.sh
      - name: Generated bindings are up to date
        run: bash tools/codegen.sh --check
      - name: Build the core library
        run: cargo build -p arya-vault-ffi --release --locked
        working-directory: core
      - name: Contract suite against the real core
        run: |
          lib="$GITHUB_WORKSPACE/core/target/release/libarya_vault_ffi.so"
          test -f "$lib"
          ARYA_FFI_LIB="$lib" flutter test test/api/contract_ffi_test.dart --reporter expanded
        working-directory: app
