name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: "Minutes to fuzz each target (the scheduled run uses 60)"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      has_targets: ${{ steps.list.outputs.has_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: List fuzz targets
        # `smoke` is a toolchain placeholder (run by ci.yml fuzz-smoke); skip it nightly.
        run: |
          matrix=$(ls core/fuzz/fuzz_targets/*.rs | xargs -n1 basename -s .rs | { grep -vx smoke || true; } | jq -R . | jq -sc '{target: .}')
          has_targets=$(echo "${matrix}" | jq '.target | length > 0')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "has_targets=${has_targets}" >> "$GITHUB_OUTPUT"
          echo "Targets: ${matrix}"

  fuzz:
    needs: targets
    # An empty matrix fails the job, so skip it until the first real target exists.
    if: needs.targets.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    # 60 minutes of fuzzing plus the build; a manual run may ask for less (or more, up to this).
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core/fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        # Scheduled runs fuzz for 60 minutes ("fuzzers run 1 h clean", docs/11); a manual run
        # takes `fuzz_minutes` (default 60). The input is validated, not interpolated.
        run: |
          minutes="${FUZZ_MINUTES:-60}"
          case "${minutes}" in
            ''|*[!0-9]*) echo "fuzz_minutes must be a whole number" >&2; exit 2 ;;
          esac
          if [ "${minutes}" -lt 1 ] || [ "${minutes}" -gt 90 ]; then
            echo "fuzz_minutes must be between 1 and 90" >&2; exit 2
          fi
          echo "Fuzzing ${TARGET} for ${minutes} minutes"
          cargo +nightly fuzz run "${TARGET}" -- -max_total_time=$((minutes * 60)) -timeout=30 -rss_limit_mb=2048
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_MINUTES: ${{ inputs.fuzz_minutes }}
      - name: Upload crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: core/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn

  nonce-draws:
    # SEC-C04 at the strength docs/11 section 2 asks for: 10^7 nonce draws (the 10^6 version
    # runs on every PR). Release build: about 20 s locally; needs a few hundred MB.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: cargo test --release --locked -p arya-vault-crypto --lib -- --ignored sec_c04
