[package]
name = "arya-vault-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
publish = false
description = "cargo-fuzz targets (not a member of the core workspace)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Path dependencies on the crates under test (one per fuzz target group).
arya-vault-crypto = { path = "../crates/crypto" }
arya-vault-vault = { path = "../crates/vault" }

# Keep this crate out of the core workspace (cargo-fuzz needs its own root).
[workspace]

[[bin]]
name = "smoke"
path = "fuzz_targets/smoke.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_recovery_key"
path = "fuzz_targets/fuzz_recovery_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cbor"
path = "fuzz_targets/fuzz_cbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_header"
path = "fuzz_targets/fuzz_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_envelope"
path = "fuzz_targets/fuzz_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_path"
path = "fuzz_targets/fuzz_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_import_csv"
path = "fuzz_targets/fuzz_import_csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_import_bitwarden"
path = "fuzz_targets/fuzz_import_bitwarden.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_import_aryavault"
path = "fuzz_targets/fuzz_import_aryavault.rs"
test = false
doc = false
bench = false
