[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
# License confirmed by owner (docs/09 ADR-0009).
license = "MPL-2.0"
repository = "https://github.com/aryacodelabs/arya-vault"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
