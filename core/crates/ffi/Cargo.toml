[package]
name = "arya-vault-ffi"
description = "The app <-> core API of docs/14 (flutter_rust_bridge input crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: arya_vault_ffi.dll / libarya_vault_ffi.so / .dylib; staticlib: iOS; rlib: tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
arya-vault-session = { path = "../session", version = "0.0.0" }
arya-vault-vault = { path = "../vault", version = "0.0.0" }
arya-vault-generator = { path = "../generator", version = "0.0.0" }
zeroize = "1.9.1"

# The Windows Hello quick-unlock provider, registered at start-up on Windows (docs/04 section 8).
[target.'cfg(windows)'.dependencies]
arya-vault-platform-windows = { path = "../platform-windows", version = "0.0.0" }
# Pinned exactly: the generated code and the Dart package must match (tools/codegen/FRB_VERSION).
flutter_rust_bridge = "=2.13.0"

[features]
default = []
# A function that panics on purpose and the fake quick-unlock provider, for tests only.
test-support = ["arya-vault-session/test-support"]

[dev-dependencies]
tempfile = "3.27.0"
# Integration tests need the test-support items.
arya-vault-ffi = { path = ".", features = ["test-support"] }

# Same as the workspace lints, except unsafe_code is `deny` (not `forbid`) so that the
# flutter_rust_bridge-generated module can carry one targeted `allow` (owner-approved exception).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
print_stdout = "warn"
