[package]
name = "arya-vault-cli"
description = "Headless test harness and scripting CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "arya-vault"
path = "src/main.rs"

[dependencies]
arya-vault-crypto = { path = "../crypto", version = "0.0.0" }
arya-vault-storage = { path = "../storage", version = "0.0.0" }
arya-vault-vault = { path = "../vault", version = "0.0.0" }
arya-vault-generator = { path = "../generator", version = "0.0.0" }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rpassword = "7.5.4"
serde_json = "1.0.151"
zeroize = "1.9.1"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"

[lints]
workspace = true
