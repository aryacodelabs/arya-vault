[package]
name = "arya-vault-generator"
description = "Password and passphrase generation (docs/04 section 12)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Deterministic, seedable RandomSource for tests and tooling. NEVER enable in
# release builds (see the compile_error! guard in src/rng.rs).
deterministic-rng = []

[dependencies]
getrandom = "0.3"
thiserror = "2"
zeroize = "1"
zxcvbn = { version = "3", default-features = false }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
