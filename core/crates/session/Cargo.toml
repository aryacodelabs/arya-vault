[package]
name = "arya-vault-session"
description = "Vault lifecycle and session state machine: create, unlock, lock, password change, recovery (docs/04, docs/07, docs/14)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arya-vault-crypto = { path = "../crypto", version = "0.0.0" }
arya-vault-storage = { path = "../storage", version = "0.0.0" }
arya-vault-vault = { path = "../vault", version = "0.0.0" }
# Master-password policy (SEC-A07); the same estimator the CLI used.
arya-vault-generator = { path = "../generator", version = "0.0.0" }
# Constant-time comparison of recovery-key confirmation answers (docs/04 §1 lists `subtle`;
# already in the dependency tree through the crypto crate).
subtle = { version = "2.6.1", default-features = false }
zeroize = "1.9.1"
thiserror = "2.0.21"

[features]
default = []
# Fake quick-unlock provider for tests; refuses to compile in release builds.
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
# Integration tests need the fake provider.
arya-vault-session = { path = ".", features = ["test-support"] }

[lints]
workspace = true
