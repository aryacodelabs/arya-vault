[package]
name = "arya-vault-vault"
description = "Items, folders, history, search, import/export (docs/05)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arya-vault-storage = { path = "../storage", version = "0.0.0" }
# Strict canonical CBOR codec (fuzzed in T02) for register values.
arya-vault-crypto = { path = "../crypto", version = "0.0.0" }
# zxcvbn-based estimator for the weak-password report.
arya-vault-generator = { path = "../generator", version = "0.0.0" }
# HKDF-Extract (= HMAC-SHA-256) as the in-memory keyed hash for reuse detection.
hkdf = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
getrandom = "0.4.3"
zeroize = "1.9.1"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[lints]
workspace = true
